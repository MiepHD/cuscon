name: F-Droid Build Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  fdroid-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install F-Droid Server Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools fdroidserver

      - name: Run F-Droid Build
        run: |
          # F-Droid erwartet ein funktionierendes Build-Umfeld
          fdroid build --verbose --only-build
