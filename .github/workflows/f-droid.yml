name: Check F-Droid Reproducibility

on:
  release:
    types: [published]

jobs:
  verify-reproducibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: robinraju/release-downloader@v1.8
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "cuscon-*-foss-release.apk"
          out-file-path: "release-apk"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build APK with F-Droid Docker
        run: |
          mkdir -p fdroid-workspace
          
          # F-Droid Build-Umgebung ausführen
          docker run --rm -v $(pwd):/repo registry.gitlab.com/fdroid/fdroidserver:build-server bash -c "
            cd /repo
            fdroid build --verbose --single-build com.froxot.cuscon.foss
          "

      - name: Compare Release APK and F-Droid Build
        run: |
          RELEASE_APK=$(find release-apk -name "cuscon-*-foss-release.apk" | head -n 1)
          BUILT_APK=$(find fdroid-workspace/unsigned -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK" ]; then
            echo "Fehler: Release-APK nicht gefunden!"
            exit 1
          fi

          echo "Release APK: $RELEASE_APK"
          echo "Built APK:   $BUILT_APK"

          # APK-Inhalte entpacken
          mkdir release_extracted built_extracted
          unzip -q "$RELEASE_APK" -d release_extracted
          unzip -q "$BUILT_APK" -d built_extracted

          # Signatur-Ordner entfernen (F-Droid baut ununterzeichnet)
          rm -rf release_extracted/META-INF
          rm -rf built_extracted/META-INF

          # Verzeichnisse vergleichen
          diff -r release_extracted built_extracted

          if [ $? -eq 0 ]; then
            echo "Erfolg: Der Build ist reproduzierbar!"
          else
            echo "Fehler: Die APK-Dateien stimmen nicht überein!"
            exit 1
          fi
