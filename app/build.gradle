apply plugin: 'com.android.application'

android {
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    compileSdk = rootProject.ext.CompileSdk

    defaultConfig {
        applicationId 'com.froxot.cuscon'
        minSdkVersion rootProject.ext.MinSdk
        targetSdkVersion rootProject.ext.TargetSdk
        versionCode 4113
        versionName '4.1.1.3'
        multiDexEnabled true
    }

    bundle {
        language { enableSplit false }
    }

    signingConfigs {
        release {
            storeFile file("upload-keystore.jks")
            storePassword findProperty("PASSWORD")
            keyAlias 'upload'
            keyPassword findProperty("PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
    
    flavorDimensions "variant"
	productFlavors {
		play {
			dimension "variant"
			resValue "string", "app_name", "cuscon"
			matchingFallbacks = ["play"]
		}
		foss {
			dimension "variant"
			applicationIdSuffix '.foss'
			resValue "string", "app_name", "cuscon"
			matchingFallbacks = ["foss"]
		}
	}

    sourceSets {
        play {
            java.srcDirs = ['src/play/java/']
            res.srcDirs = ["src/play/res/"]
            manifest.srcFile "play/AndroidManifest.xml"
        }
        foss {
            java.srcDirs = ['src/foss/java/']
            manifest.srcFile "foss/AndroidManifest.xml"
        }
    }
    namespace 'com.froxot.cuscon'
}

base {
    archivesName = "${parent.name}-v${android.defaultConfig.versionCode}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
	playImplementation 'com.github.MiepHD.candybar:library:3.23.0.7'
	fossImplementation 'com.github.MiepHD:candybar-foss:3.23.0.7'
}

tasks.register('finishXMLs', Exec) {
    mustRunAfter 'clean'
    commandLine 'bash', './finishXMLs.sh'
}

// Erzwinge, dass die Build-Tasks erst NACH finishXMLs laufen
['assembleFossRelease', 'bundlePlayRelease', 'assemblePlayRelease'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        mustRunAfter 'finishXMLs', 'clean'
    }
}

tasks.register('buildRelease') {
    dependsOn 'clean', 'finishXMLs', 'assembleFossRelease', 'bundlePlayRelease', 'assemblePlayRelease'
}
